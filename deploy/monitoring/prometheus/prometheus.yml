global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: aquasecure-monitoring

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  # Laravel runs on the host: `php artisan serve` (127.0.0.1:8000).
  - job_name: laravel
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:8000
        labels:
          service: aquasecure-laravel
