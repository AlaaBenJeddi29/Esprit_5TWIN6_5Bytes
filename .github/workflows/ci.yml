name: CI

on:
  push:
    branches:
      - main
      - 'gestion*'
  pull_request:
    branches:
      - main
      - 'gestion*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (PHP 8.3, MySQL 8)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          # Nom aligné sur DB_DATABASE forcé par phpunit.xml.
          MYSQL_DATABASE: aquasecure_ci_test
          MYSQL_USER: aquasecure
          MYSQL_PASSWORD: aquasecure_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_DEBUG: 'true'
      APP_MAINTENANCE_DRIVER: file
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: aquasecure_ci_test
      DB_USERNAME: aquasecure
      DB_PASSWORD: aquasecure_ci
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      FILESYSTEM_DISK: local
      GEMINI_API_KEY: ''
      LOCAL_LLM_ENABLED: 'false'
      STRIPE_SECRET: ''
      STRIPE_WEBHOOK_SECRET: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_mysql, openssl, fileinfo, ctype, tokenizer, xml, dom, session, iconv
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer configuration
        run: composer validate --strict --no-check-publish

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Generate application key
        run: echo "APP_KEY=$(php artisan key:generate --show --no-ansi)" >> "$GITHUB_ENV"

      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if php -r 'try { new PDO("mysql:host=127.0.0.1;port=3306;dbname=aquasecure_ci_test", "aquasecure", "aquasecure_ci"); } catch (Throwable $e) { exit(1); }'; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready in time" >&2
          exit 1

      - name: Verify migrations on a clean test database
        run: php artisan migrate --force --no-interaction

      - name: Lint PHP sources
        run: find app database routes config tests -name '*.php' -print0 | xargs -0 -n1 -P4 php -l > /dev/null

      - name: Run test suite
        run: composer test
